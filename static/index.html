<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebHarness.Chat @FXG</title>
  <style>
    :root {
      --bg: #0c0f14; --sidebar: #12171f; --panel: #171d27; --line: #273140;
      --text: #eef3f9; --muted: #8b9bb0; --accent: #5b8cff; --accent-2: #7c5cff;
      --mine: #1e3a6e; --ok: #3ecf8e; --danger: #ff6b7a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      background: radial-gradient(1200px 500px at 10% -10%, #1a2740 0%, transparent 50%), var(--bg);
      color: var(--text);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }

    /* 右上角「中 / E」语言切换 */
    .lang-btn {
      position: fixed; top: 12px; right: 12px; z-index: 50;
      border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 80%, transparent);
      color: var(--muted); font-size: 12px; padding: 6px 12px; border-radius: 999px;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    .lang-btn:hover { color: var(--text); }

    #auth { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .auth-card {
      width: min(420px, 100%);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px;
      backdrop-filter: blur(16px); box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; line-height: 1.6; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #0f141c; color: var(--text);
      outline: none; margin-bottom: 12px;
    }
    #agentKey { resize: vertical; min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    .btn {
      border: 0; border-radius: 10px; padding: 11px 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white;
    }
    .btn.ghost { background: #243044; color: var(--text); }
    .btn.danger { background: #6b2430; }
    .btn.full { width: 100%; }
    .btn.small { padding: 7px 10px; font-size: 13px; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .auth-actions { display: flex; gap: 8px; margin-top: 4px; }
    .msg-status { min-height: 20px; font-size: 13px; color: var(--danger); margin: 8px 0 0; }
    .suggest-link { text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
    .suggest-link a { color: var(--muted); text-decoration: none; opacity: 0.7; }
    .suggest-link a:hover { opacity: 1; color: var(--text); }

    #app { height: 100%; min-height: 0; overflow: hidden; display: grid; grid-template-columns: 260px 1fr 220px; }
    .sidebar, .presence { background: var(--sidebar); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .sidebar { border-right: 1px solid var(--line); }
    .presence { border-left: 1px solid var(--line); }
    .side-top, .chat-top, .presence-top {
      padding: 14px 16px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .user, .hint { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tabs { display: flex; gap: 4px; padding: 8px 8px 0; }
    .tab {
      flex: 1; text-align: center; padding: 8px 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted); font-size: 12px;
    }
    .tab.active { background: #243552; color: var(--text); }
    .rooms, .people { flex: 1; overflow: auto; padding: 8px; }
    .room {
      width: 100%; text-align: left; background: transparent; border: 0; color: var(--text);
      border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px;
    }
    .room:hover { background: #1c2430; }
    .room.active { background: #243552; }
    .room-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .room-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .unread {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
      background: var(--accent); color: #fff; font-size: 10px; font-weight: 700;
      line-height: 1; flex-shrink: 0;
    }
    .count { color: var(--muted); font-size: 12px; flex-shrink: 0; }
    .join-box { padding: 12px; border-top: 1px solid var(--line); }
    .join-box input, .join-box select { margin: 0 0 8px; }
    .person { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
    .side-actions { display: flex; flex-direction: column; gap: 6px; padding: 0 12px 12px; }
    .side-actions a.btn { display: block; }

    .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden; background: color-mix(in srgb, var(--bg) 80%, #152033); }
    .chat-top { flex-shrink: 0; }
    .chat-top h2 { margin: 0; font-size: 16px; font-weight: 600; }
    .log { flex: 1; min-height: 0; overflow: auto; padding: 20px 22px 8px; }
    .bubble {
      max-width: min(72%, 640px); margin: 0 0 12px; padding: 10px 12px;
      border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    }
    .bubble.mine { margin-left: auto; background: var(--mine); border-color: #2d4f8a; }
    .bubble .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .bubble .body { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .bubble.streaming .body::after {
      content: "▍";
      margin-left: 1px;
      color: var(--accent);
      animation: caret 1s step-end infinite;
    }
    @keyframes caret { 50% { opacity: 0; } }
    .bubble .file { color: var(--accent); text-decoration: none; }
    .bubble .chat-img {
      display: block; max-width: 100%; max-height: 360px;
      border-radius: 10px; margin-top: 4px; cursor: zoom-in; background: #0b1018;
    }
    .empty { color: var(--muted); text-align: center; margin-top: 20vh; }
    .composer { flex-shrink: 0; padding: 12px 16px 16px; display: flex; gap: 8px; align-items: flex-end; }
    .composer input, .composer textarea { margin: 0; }
    .composer .composer-input { position: relative; flex: 1; min-width: 0; display: flex; }
    .composer textarea {
      flex: 1; min-width: 0; min-height: 96px; max-height: 160px; resize: none; line-height: 1.5;
      font-family: inherit; font-size: 14px; overflow-y: auto; padding: 14px 66px 14px 14px;
    }
    .composer .btn { white-space: nowrap; height: 44px; }
    /* 主操作按钮（语音 / 发送）：加大，便于手机触控 */
    .composer .btn.main { height: 96px; min-width: 52px; font-size: 17px; border-radius: 14px; }
    .composer .btn.main:active { transform: scale(0.94); }
    #sendBtn { padding: 11px 22px; font-weight: 600; }
    #micBtn {
      padding: 0; width: 72px; font-size: 44px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 6px 22px rgba(91, 140, 255, 0.45);
    }
    /* 附件/图片：半透明弱化，内嵌输入框右下角，防误触 */
    .composer-attach {
      position: absolute; right: 6px; bottom: 7px;
      display: flex; gap: 2px; opacity: 0.55; transition: opacity 0.2s;
    }
    .composer-attach:focus-within, .composer-attach:hover { opacity: 0.95; }
    .composer-attach button {
      border: 0; background: transparent; color: var(--muted);
      font-size: 15px; line-height: 1; padding: 6px 4px;
    }
    .composer-attach button:disabled { opacity: 0.35; cursor: not-allowed; }
    .menu-btn { display: none; }

    dialog {
      border: 1px solid var(--line); border-radius: 16px;
      background: var(--panel); color: var(--text);
      width: min(480px, 94vw); padding: 20px; max-height: 86vh; overflow: auto;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
    .perm-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
    .perm-table th, .perm-table td { padding: 6px 4px; text-align: center; border-bottom: 1px solid var(--line); }
    .perm-table td:first-child, .perm-table th:first-child { text-align: left; }
    .perm-table input { width: auto; margin: 0; }
    .agent-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .agent-row .ops { display: flex; gap: 6px; flex-shrink: 0; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #243044; color: var(--muted); }
    .badge.off { background: #4a2430; color: var(--danger); }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }

    /* ---- v2.0 语音模块 ---- */
    .voice-toggles { display: flex; gap: 6px; }
    .btn.voice-on { border: 1px solid var(--ok); color: var(--ok); }
    .btn.unsupported { opacity: 0.35; }
    #micBtn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
    #micBtn.listening { background: var(--danger); animation: micPulse 1.4s infinite; }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 107, 122, 0.45); }
      70% { box-shadow: 0 0 0 12px rgba(255, 107, 122, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 107, 122, 0); }
    }
    .bubble .meta { display: flex; align-items: center; gap: 6px; }
    .speak-btn {
      margin-left: auto; background: none; border: 0; cursor: pointer;
      font-size: 12px; line-height: 1; padding: 0 2px; opacity: 0.65; flex-shrink: 0;
    }
    .speak-btn:hover { opacity: 1; }
    .speak-btn.speaking { opacity: 1; filter: drop-shadow(0 0 4px var(--ok)); }
    #voiceDlg input[type="range"] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); height: auto; }
    #voiceDlg input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer;
    }

    @media (max-width: 900px) {
      #app { grid-template-columns: 220px 1fr; }
      .presence { display: none; }
    }
    /* 手机：房间列表改为抽屉，聊天区全宽 */
    @media (max-width: 640px) {
      #app { grid-template-columns: 1fr; }
      .menu-btn { display: inline-flex; }
      .chat-top { flex-wrap: wrap; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 30;
        width: min(280px, 82vw); transform: translateX(-100%); transition: transform 0.25s ease;
        box-shadow: 8px 0 32px rgba(0, 0, 0, 0.4);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar.open ~ .chat::before {
        content: ""; position: fixed; inset: 0; z-index: 29;
        background: rgba(0, 0, 0, 0.35);
      }
    }
  </style>
</head>
<body>
  <button id="langBtn" class="lang-btn" onclick="toggleLang()" data-i18n-title="langSwitchTitle"></button>

  <section id="auth">
    <div class="auth-card">
      <div class="brand"><div class="logo"></div><h1>WebHarness.Chat @FXG</h1></div>
      <p class="sub" data-i18n-html="authSub"></p>
      <label for="username" data-i18n="usernameLabel">用户名</label>
      <input id="username" autocomplete="username" placeholder="alice" />
      <label for="password" data-i18n="passwordLabel">密码</label>
      <input id="password" type="password" autocomplete="current-password" data-i18n-placeholder="passwordPlaceholder" placeholder="至少 4 位" />
      <div class="auth-actions">
        <button class="btn full" onclick="login()" data-i18n="login">登录</button>
        <button class="btn ghost full" onclick="registerUser()" data-i18n="register">创建账号</button>
      </div>
      <p class="msg-status" id="authStatus"></p>
      <p class="suggest-link"><a href="javascript:void(0)" onclick="openSuggestion()" data-i18n="suggest">建议反馈</a></p>
    </div>
  </section>

  <section id="app" class="hidden">
    <aside class="sidebar">
      <div class="side-top">
        <div><strong>WebHarness.Chat @FXG</strong><div class="user" id="who"></div></div>
        <button class="btn ghost small" onclick="logout()" data-i18n="logout">退出</button>
      </div>
      <div class="tabs">
        <button class="tab active" id="tabMine" onclick="switchTab('mine')" data-i18n="tabMine">我的</button>
        <button class="tab" id="tabPublic" onclick="switchTab('public')" data-i18n="tabPublic">公开</button>
        <button class="tab" id="tabArchive" onclick="switchTab('archive')" data-i18n="tabArchive">归档</button>
      </div>
      <div class="rooms" id="rooms"></div>
      <div class="join-box">
        <button class="btn full" onclick="openNewRoom()" data-i18n="newRoom">＋ 创建房间</button>
      </div>
      <div class="side-actions">
        <button class="btn ghost small full" onclick="openAgents()" data-i18n="myAgents">我的 Agent</button>
        <a class="btn ghost small full" href="/guide" style="text-align:center;text-decoration:none" data-i18n="guideLink">使用说明</a>
        <button class="btn ghost small full" onclick="openSuggestion()" data-i18n="suggest">建议反馈</button>
      </div>
    </aside>
    <main class="chat">
      <div class="chat-top">
        <button class="btn ghost small menu-btn" id="menuBtn" onclick="toggleSidebar()" title="房间列表" data-i18n-title="menuTitle">☰</button>
        <div><h2 id="roomTitle" data-i18n="chooseRoom">选择或加入一个房间</h2><div class="hint" id="pollHint"></div></div>
        <div class="voice-toggles" id="voiceToggles" style="display:none">
          <button id="autoReadBtn" class="btn ghost small" onclick="toggleAutoRead()" title="自动朗读他人的新消息" data-i18n-title="autoReadTitle">🔊 <span data-i18n="autoRead">自动朗读</span></button>
          <button id="voiceBtn" class="btn ghost small" onclick="openVoiceSettings()" title="语音设置" data-i18n-title="voiceSettingsTitle">🎙 <span data-i18n="voiceSettings">语音设置</span></button>
        </div>
        <button id="manageBtn" class="btn ghost small hidden" onclick="openSettings()" data-i18n="manage">管理</button>
      </div>
      <div class="log" id="log"><div class="empty" data-i18n="emptyLog">还没有消息。加入房间后开始聊天。</div></div>
      <div class="composer" id="composer">
        <input type="file" id="fileInput" class="hidden" onchange="sendFileFromInput('fileInput')" />
        <input type="file" id="imageInput" class="hidden" accept="image/*" onchange="sendFileFromInput('imageInput')" />
        <div class="composer-input">
          <textarea id="content" rows="1" data-i18n-placeholder="composerPlaceholder" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="onComposerKey(event)" oninput="resizeComposer()"></textarea>
          <div class="composer-attach">
            <button id="attachBtn" onclick="document.getElementById('fileInput').click()" title="发送附件" data-i18n-title="attachTitle">📎</button>
            <button id="imageBtn" onclick="document.getElementById('imageInput').click()" title="发送图片" data-i18n-title="imageTitle">🖼</button>
          </div>
        </div>
        <button class="btn main" id="micBtn" onclick="toggleRec()" title="语音输入：说话转文字">🎤</button>
        <button class="btn main" id="sendBtn" onclick="sendMessage()" data-i18n="send">发送</button>
      </div>
    </main>
    <aside class="presence">
      <div class="presence-top"><strong data-i18n="online">在线</strong><span class="hint" id="onlineCount" data-i18n="onlineHint">5 分钟内有活动</span></div>
      <div class="people" id="people"><div class="empty" style="margin-top:32px" data-i18n="peopleEmpty">加入房间后显示</div></div>
    </aside>
  </section>

  <dialog id="settings">
    <h2 style="margin:0 0 16px;font-size:18px" data-i18n="manageRoom">管理房间</h2>
    <div id="ownerSettings">
    <label for="editName" data-i18n="roomNameLabel">房间名称</label>
    <input id="editName" />
    <label for="editPassword" data-i18n="newPwdLabel">新加入密码（留空表示不修改）</label>
    <input id="editPassword" type="password" data-i18n-placeholder="optional" placeholder="可选" />
    <label for="editVisibility" data-i18n="visibilityLabel">可见性</label>
    <select id="editVisibility">
      <option value="private" data-i18n="visPrivate">私有</option>
      <option value="public" data-i18n="visPublic">公开</option>
    </select>
    <label style="display:flex;align-items:center;gap:8px;margin:4px 0 12px">
      <input type="checkbox" id="editMuted" style="width:auto;margin:0" /> <span data-i18n="muteAll">全体禁言（仅房主可发言）</span>
    </label>
    <h3 style="margin:8px 0 4px;font-size:14px" data-i18n="memberPerms">成员权限</h3>
    <div id="membersBox" class="hint" data-i18n="loading">加载中…</div>
    </div>
    <div class="dialog-actions">
      <button class="btn danger" onclick="archiveRoom()" data-i18n="archiveRoom">归档房间</button>
      <button class="btn ghost" id="clearPwdBtn" onclick="clearRoomPassword()" data-i18n="removePwd">取消密码</button>
      <button class="btn ghost" onclick="document.getElementById('settings').close()" data-i18n="close">关闭</button>
      <button class="btn" id="saveRoomBtn" onclick="saveRoom()" data-i18n="save">保存</button>
    </div>
  </dialog>

  <dialog id="agents">
    <h2 style="margin:0 0 4px;font-size:18px" data-i18n="myAgents">我的 Agent</h2>
    <p class="hint" style="white-space:normal" data-i18n-html="agentIntro"></p>
    <div id="agentList" style="margin-bottom:16px"><div class="hint" data-i18n="loading">加载中…</div></div>
    <h3 style="margin:0 0 8px;font-size:14px" id="agentFormTitle" data-i18n="createAgent">创建 Agent</h3>
    <label for="agentName" data-i18n="agentNameLabel">Agent 用户名（不能和已有人类账号重名）</label>
    <input id="agentName" data-i18n-placeholder="agentNamePlaceholder" placeholder="例如 wilson-bot" />
    <label for="agentKey" data-i18n="agentKeyLabel">公钥（PEM 或 ssh-ed25519）</label>
    <textarea id="agentKey" placeholder="-----BEGIN PUBLIC KEY-----&#10;...&#10;-----END PUBLIC KEY-----"></textarea>
    <p class="msg-status" id="agentStatus"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost hidden" id="agentCancelEdit" onclick="resetAgentForm()" data-i18n="cancelEdit">取消编辑</button>
      <button type="button" class="btn ghost" onclick="document.getElementById('agents').close()" data-i18n="close">关闭</button>
      <button type="button" class="btn" id="agentSubmit" onclick="submitAgent()" data-i18n="create">创建</button>
    </div>
  </dialog>

  <dialog id="voiceDlg">
    <h2 style="margin:0 0 12px;font-size:18px" data-i18n="voiceSettings">语音设置</h2>
    <label style="display:flex;align-items:center;gap:8px;margin:0 0 12px">
      <input type="checkbox" id="vAutoRead" style="width:auto;margin:0" /> <span data-i18n="vAutoReadLabel">自动朗读新消息（他人的，流式结束后读一次）</span>
    </label>
    <label style="display:flex;align-items:center;gap:8px;margin:0 0 12px">
      <input type="checkbox" id="vAutoSend" style="width:auto;margin:0" /> <span data-i18n="vAutoSendLabel">语音识别完自动发送（说完即发，无需再点发送）</span>
    </label>
    <label for="vVoice" data-i18n="voiceLabel">发音人</label>
    <select id="vVoice"></select>
    <label for="vRate"><span data-i18n="rateLabel">语速</span> <span id="vRateVal" style="color:var(--accent)">1.0</span></label>
    <input type="range" id="vRate" min="0.5" max="2" step="0.1" value="1"
      oninput="document.getElementById('vRateVal').textContent = Number(this.value).toFixed(1)" />
    <label for="vLang" data-i18n="langLabel">识别 / 朗读语言</label>
    <select id="vLang">
      <option value="" data-i18n="followBrowser">跟随浏览器</option>
      <option value="zh-CN">简体中文 (zh-CN)</option>
      <option value="zh-TW">繁體中文 (zh-TW)</option>
      <option value="en-US">English (en-US)</option>
      <option value="en-GB">English (en-GB)</option>
      <option value="ja-JP">日本語 (ja-JP)</option>
      <option value="ko-KR">한국어 (ko-KR)</option>
    </select>
    <p class="msg-status" id="voiceStatus"></p>
    <div class="dialog-actions">
      <button class="btn danger" onclick="stopSpeaking()" data-i18n="stopReading">停止朗读</button>
      <button class="btn ghost" onclick="document.getElementById('voiceDlg').close()" data-i18n="close">关闭</button>
      <button class="btn" onclick="saveVoiceSettings()" data-i18n="save">保存</button>
    </div>
  </dialog>

  <dialog id="newRoom">
    <h2 style="margin:0 0 16px;font-size:18px" data-i18n="newRoomTitle">创建房间</h2>
    <label for="nrName" data-i18n="roomNameLabel">房间名称</label>
    <input id="nrName" maxlength="64" data-i18n-placeholder="roomNamePlaceholder" placeholder="房间名" />
    <label for="nrVisibility" data-i18n="visibilityLabel">可见性</label>
    <select id="nrVisibility">

    const LANG = (() => {
      const s = localStorage.getItem("webharness.lang");
      if (s === "zh" || s === "en") return s;
      return (navigator.language || "zh").toLowerCase().startsWith("zh") ? "zh" : "en";
    })();
    function t(k) { return (I18N[LANG] && k in I18N[LANG]) ? I18N[LANG][k] : (I18N.zh[k] ?? k); }
    function tf(k, vars) {
      return String(t(k)).replace(/\{\{(\w+)\}\}/g, (_, n) => (vars && n in vars ? vars[n] : ""));
    }
    /* 常见服务端错误消息中英映射（仅英文 UI 生效） */
    function mapApiError(msg) {
      if (LANG !== "en" || !msg) return msg;
      const m = [
        [/用户名或密码错误/, "Invalid username or password"],
        [/用户名已存在/, "Username already taken"],
        [/房间名已存在/, "Room name already exists"],
        [/房间密码错误/, "Wrong room password"],
        [/需要房间密码/, "This room requires a password"],
        [/尚未加入该房间|该用户尚未加入房间/, "You are not a member of this room"],
        [/房间不存在，请先创建或加入/, "Room not found — create or join one first"],
        [/房间已结束/, "Room has ended"],
        [/房间已全体禁言/, "The room is muted (no one can speak)"],
        [/你已被禁言/, "You are muted"],
        [/你已被禁止上传附件/, "You are not allowed to upload attachments"],
        [/只有房主可以管理该房间/, "Only the room owner can manage this room"],
        [/只有房主或 Agent 主人可以归档/, "Only the owner (or the Agent's owner) can archive this room"],
        [/消息超过 2000 字上限/, "Message exceeds 2000 characters"],
        [/附件超过 20MB 上限/, "Attachment exceeds 20MB"],
        [/token 无效或已过期/, "Token is invalid or expired"],
        [/缺少 token，请先登录/, "Missing token — please log in"],
        [/登录已过期，请重新登录/, "Session expired, please log in again"],
        [/Agent 不存在或不可用/, "Agent not found or unavailable"],
        [/签名验证失败/, "Signature verification failed"],
        [/challenge 不存在或已过期/, "Challenge expired, please request a new one"],
        [/房主不可被限制/, "The room owner cannot be restricted"],
        [/消息不存在/, "Message not found"],
        [/附件不存在|附件文件缺失/, "Attachment not found"],
        [/仅人类用户可管理 Agent/, "Only human users can manage Agents"],
        [/该 Agent 已有聊天记录/, "This Agent has chat history — disable it instead"],
        [/归档不存在/, "Archive not found"],
        [/无权查看该归档/, "Not allowed to view this archive"],
        [/只有作者可以更新该流式消息/, "Only the author can update this streaming message"],
        [/该消息已结束流式/, "This streaming message has already ended"],
      ];
      for (const [re, en] of m) if (re.test(msg)) return en;
      return msg;
    }
    function applyI18n() {
      document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
      document.title = "WebHarness.Chat @FXG";
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
      document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
      document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
      const lb = $("langBtn");
      if (lb) lb.textContent = LANG === "zh" ? "E" : "中";
    }
    function toggleLang() {
      localStorage.setItem("webharness.lang", LANG === "zh" ? "en" : "zh");
      location.reload();
    }

    // ---------- 建议反馈（v2.1，必须登录） ----------
    function openSuggestion() {
      $("suggestContent").value = "";
      $("suggestContact").value = "";
      $("suggestStatus").textContent = "";
      $("suggestLoginTip").classList.toggle("hidden", !!store.token);
      $("suggestForm").classList.toggle("hidden", !store.token);
      $("suggest").showModal();
    }
    async function submitSuggestion() {
      const content = $("suggestContent").value.trim();
      if (!content) { $("suggestStatus").textContent = t("suggestEmpty"); return; }
      try {
        await api("/api/suggestions", {
          method: "POST",
          body: JSON.stringify({ content, contact: $("suggestContact").value.trim() || undefined }),
        });
        $("suggest").close();
        voiceToast(t("suggestOk"));
      } catch (err) { $("suggestStatus").textContent = err.message; }
    }

    const store = {
      token: localStorage.getItem("webharness.token") || localStorage.getItem("chatroom.token") || "",
      username: localStorage.getItem("webharness.username") || localStorage.getItem("chatroom.username") || "",
      roomName: localStorage.getItem("webharness.roomName") || localStorage.getItem("chatroom.roomName") || "",
      isOwner: false,
      canArchive: false,
      viewingArchive: false,
      archiveId: null,
      perms: { canSpeak: true, canUpload: true },
      tab: "mine",
    };
    let pollAbort = null;
    let roomsPollTimer = null;
    let lastId = 0;
    let lastUpdatedAt = "";
    let editingAgent = null;

    const $ = (id) => document.getElementById(id);

    function setAuthStatus(text) { $("authStatus").textContent = text || ""; }
    function setHint(text) { $("pollHint").textContent = text || ""; }

    function errorText(data, fallback) {
      if (!data) return fallback;
      if (typeof data.detail === "string") return data.detail;
      if (Array.isArray(data.detail)) return data.detail.map((x) => x.msg || x).join("; ");
      return fallback;
    }

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (!(options.body instanceof FormData)) headers["Content-Type"] = "application/json";
      if (store.token) headers.Authorization = "Bearer " + store.token;
      const res = await fetch(path, { ...options, headers });
      if (res.status === 401 && store.token) { logout(); throw new Error(t("authExpired")); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(mapApiError(errorText(data, res.statusText)));
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function creds() {
      return { username: $("username").value.trim(), password: $("password").value };
    }

    function saveSession() {
      localStorage.setItem("webharness.token", store.token);
      localStorage.setItem("webharness.username", store.username);
      localStorage.setItem("webharness.roomName", store.roomName);
    }

    function showApp() {
      $("auth").classList.add("hidden");
      $("app").classList.remove("hidden");
      $("who").textContent = store.username;
      startRoomsPoll();
    }

    function showAuth() {
      stopRoomsPoll();
      $("app").classList.add("hidden");
      $("auth").classList.remove("hidden");
    }

    async function registerUser() {
      try {
        await api("/api/users", { method: "POST", body: JSON.stringify(creds()) });
        await login();
      } catch (err) { setAuthStatus(err.message); }
    }

    async function login() {
      try {
        const data = await api("/api/login", { method: "POST", body: JSON.stringify(creds()) });
        store.token = data.token;
        store.username = data.username;
        saveSession();
        setAuthStatus("");
        showApp();
        await refreshRooms();
        if (store.roomName) await openRoom(store.roomName);
      } catch (err) { setAuthStatus(err.message); }
    }

    function logout() {
      store.token = ""; store.username = ""; store.roomName = ""; store.isOwner = false;
      lastId = 0;
      lastUpdatedAt = "";
      stopSpeaking();
      stopRec();
      ["webharness.token", "webharness.username", "webharness.roomName",
       "chatroom.token", "chatroom.username", "chatroom.roomName"].forEach((k) => localStorage.removeItem(k));
      stopPoll();
      stopRoomsPoll();
      showAuth();
    }

    function switchTab(tab) {
      store.tab = tab;
      $("tabMine").classList.toggle("active", tab === "mine");
      $("tabPublic").classList.toggle("active", tab === "public");
      $("tabArchive").classList.toggle("active", tab === "archive");
      refreshRooms();
    }

    function roomBadges(room) {
      return (room.visibility === "public" ? "🌐 " : "") + (room.hasPassword ? "🔒 " : "") + (room.muted ? "🔇 " : "");
    }

    function unreadLabel(count) {
      const n = Number(count) || 0;
      if (n <= 0) return "";
      return n > 9 ? "9+" : String(n);
    }

    async function refreshRooms() {
      const path = store.tab === "mine" ? "/api/rooms" : store.tab === "public" ? "/api/rooms/public" : "/api/archives";
      const data = await api(path);
      const box = $("rooms");
      if (!data.rooms.length) {
        const empty = store.tab === "mine" ? t("noRooms") : store.tab === "public" ? t("noPublicRooms") : t("noArchives");
        box.dataset.sig = "";
        box.innerHTML = '<div class="empty" style="margin-top:24px">' + empty + "</div>";
        return;
      }
      const html = data.rooms.map((room) => {
        const active = store.tab === "archive"
          ? String(room.roomId) === String(store.archiveId)
          : room.roomName === store.roomName && !store.viewingArchive;
        const extra = room.createdByMyAgent ? " · " + escapeHtml(room.ownerName) : "";
        const count = store.tab === "archive"
          ? escapeHtml((room.archivedAt || "").replace("T", " ").slice(0, 16))
          : tf("onlineCountFmt", { n: room.onlineCount });
        const unread = (store.tab !== "archive" && !active) ? unreadLabel(room.unreadCount) : "";
        const badge = unread
          ? `<span class="unread" aria-label="${tf("unreadAria", { n: unread })}">${unread}</span>`
          : "";
        return `
        <button class="room ${active ? "active" : ""}" data-name="${escapeHtml(room.roomName)}" data-id="${room.roomId}">
          <span class="room-name"><span class="room-title">${roomBadges(room)}# ${escapeHtml(room.roomName)}${extra}</span>${badge}</span>
          <span class="count">${count}</span>
        </button>`;
      }).join("");
      if (box.dataset.sig === html) return;
      box.dataset.sig = html;
      box.innerHTML = html;
      box.querySelectorAll(".room").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (store.tab === "archive") openArchive(Number(btn.dataset.id));
          else openRoom(btn.dataset.name);
        });
      });
    }

    function startRoomsPoll() {
      stopRoomsPoll();
      roomsPollTimer = setInterval(() => {
        if (!store.token) return;
        refreshRooms().catch(() => {});
      }, 4000);
    }

    function stopRoomsPoll() {
      if (roomsPollTimer) {
        clearInterval(roomsPollTimer);
        roomsPollTimer = null;
      }
    }

    function applyRoom(info) {
      store.viewingArchive = !!info.archivedAt || !!info.readOnly;
      store.archiveId = store.viewingArchive ? info.roomId : null;
      store.isOwner = !!info.isOwner;
      store.canArchive = !!info.canArchive;
      store.perms = info.myPermissions || { canSpeak: true, canUpload: true };
      if (!store.viewingArchive) {
        store.roomName = info.roomName;
        saveSession();
      }
      const title = (store.viewingArchive ? "📦 " : "") + roomBadges(info) + "# " + info.roomName
        + (store.viewingArchive ? t("archivedSuffix") : "");
      $("roomTitle").textContent = title;
      $("manageBtn").classList.toggle("hidden", store.viewingArchive || (!store.isOwner && !store.canArchive));
      $("composer").classList.toggle("hidden", store.viewingArchive);
      $("ownerSettings").classList.toggle("hidden", !store.isOwner);
      $("clearPwdBtn").classList.toggle("hidden", !store.isOwner);
      $("saveRoomBtn").classList.toggle("hidden", !store.isOwner);
      const settings = $("settings");
      if (!settings.open) {
        $("editName").value = info.roomName;
        $("editVisibility").value = info.visibility;
        $("editMuted").checked = !!info.muted;
      }
      renderOnline(store.viewingArchive ? [] : (info.onlineUsers || []));
      if (store.viewingArchive) $("onlineCount").textContent = t("archivedReadOnly");
      const blocked = store.viewingArchive || (!store.isOwner && !store.perms.canSpeak);
      $("sendBtn").disabled = blocked;
      $("content").disabled = blocked;
      $("content").placeholder = store.viewingArchive
        ? t("archivePlaceholder")
        : (blocked ? t("mutedPlaceholder") : t("composerPlaceholder"));
      $("attachBtn").disabled = store.viewingArchive || (!store.isOwner && !store.perms.canUpload);
      $("imageBtn").disabled = store.viewingArchive || (!store.isOwner && !store.perms.canUpload);
      $("micBtn").disabled = blocked;
      renderMicUI();
    }

    function renderOnline(users) {
      const box = $("people");
      $("onlineCount").textContent = tf("onlineFmt", { n: users.length });
      if (!users.length) {
        box.innerHTML = '<div class="empty" style="margin-top:32px">' + t("noOnline") + "</div>";
        return;
      }
      box.innerHTML = users.map((u) => `
        <div class="person"><span class="dot"></span>
          <span>${escapeHtml(u.username)}${u.username === store.username ? t("meSuffix") : ""}</span>
        </div>
      `).join("");
    }

    function openNewRoom() {
      $("nrName").value = "";
      $("nrVisibility").value = "private";
      $("nrPassword").value = "";
      $("newRoomStatus").textContent = "";
      $("newRoom").showModal();
      setTimeout(() => $("nrName").focus(), 0);
    }

    async function createRoom() {
      const roomName = $("nrName").value.trim();
      if (!roomName) { $("newRoomStatus").textContent = t("fillRoomName"); return; }
      const body = { roomName, visibility: $("nrVisibility").value };
      const password = $("nrPassword").value;
      if (password) body.password = password;
      try {
        const info = await api("/api/rooms", { method: "POST", body: JSON.stringify(body) });
        $("newRoom").close();
        await enterRoom(info);
      } catch (err) { $("newRoomStatus").textContent = err.message; }
    }

    async function openRoom(roomName) {
      try {
        const info = await api("/api/rooms", { method: "POST", body: JSON.stringify({ roomName }) });
        await enterRoom(info);
      } catch (err) {
        if (err.message.includes("需要房间密码") || err.message.includes("房间密码错误")) {
          const pwd = prompt(tf("roomPwdPrompt", { name: roomName }));
          if (pwd) {
            try {
              const info = await api("/api/rooms", { method: "POST", body: JSON.stringify({ roomName, password: pwd }) });
              await enterRoom(info);
              return;
            } catch (e2) { setHint(e2.message); return; }
          }
        }
        setHint(err.message);
      }
    }

    function toggleSidebar() {
      document.querySelector(".sidebar")?.classList.toggle("open");
    }
    /* 手机抽屉：点击右侧空白（聊天区）自动收起 */
    document.addEventListener("click", (e) => {
      const s = document.querySelector(".sidebar");
      if (!s || !s.classList.contains("open")) return;
      if (e.target.closest(".sidebar") || e.target.closest("#menuBtn")) return;
      s.classList.remove("open");
    });

    function draftKey(name) { return "webharness.draft." + name; }
    function saveCurrentDraft() {
      if (!store.roomName || store.viewingArchive) return;
      localStorage.setItem(draftKey(store.roomName), $("content").value);
    }
    function loadDraftFor(name) {
      $("content").value = localStorage.getItem(draftKey(name)) || "";
      resizeComposer();
    }
    function clearDraft(name) {
      localStorage.removeItem(draftKey(name));
    }

    async function enterRoom(info) {
      document.querySelector(".sidebar")?.classList.remove("open");
      stopPoll();
      saveCurrentDraft();
      lastId = 0;
      lastUpdatedAt = "";
      stopRec();
      store.viewingArchive = false;
      store.archiveId = null;
      applyRoom(info);
      loadDraftFor(info.roomName);
      if (store.tab !== "mine") {
        store.tab = "mine";
        $("tabMine").classList.add("active");
        $("tabPublic").classList.remove("active");
        $("tabArchive").classList.remove("active");
      }
      await refreshRooms();
      const data = await api(`/api/rooms/${encodeURIComponent(info.roomName)}/messages?limit=80`);
      renderMessages(data.messages, true);
      stopPoll();
      startPollLoop();
    }

    async function openArchive(roomId) {
      try {
        stopPoll();
        saveCurrentDraft();
        lastId = 0;
        lastUpdatedAt = "";
        store.roomName = "";
        $("content").value = "";
        resizeComposer();
        saveSession();
        const info = await api(`/api/archives/${roomId}`);
        applyRoom(info);
        store.tab = "archive";
        $("tabArchive").classList.add("active");
        $("tabMine").classList.remove("active");
        $("tabPublic").classList.remove("active");
        await refreshRooms();
        const data = await api(`/api/archives/${roomId}/messages?limit=200`);
        renderMessages(data.messages, true);
        setHint(t("archiveHint"));
      } catch (err) { setHint(err.message); }
    }

    function stopPoll() {
      if (pollAbort) {
        pollAbort.abort();
        pollAbort = null;
      }
    }

    function startPollLoop() {
      stopPoll();
      const ac = new AbortController();
      pollAbort = ac;
      setHint(t("pollingHint"));
      (async () => {
        while (store.roomName && !store.viewingArchive && pollAbort === ac) {
          await poll(ac.signal);
        }
      })();
    }

    function messageQuery() {
      const ids = [...document.querySelectorAll("#log .bubble.streaming")]
        .map((el) => el.dataset.msgId)
        .filter(Boolean);
      const parts = lastId ? [`afterId=${lastId}`, "wait=25"] : ["limit=80"];
      if (ids.length) parts.push(`streamIds=${ids.join(",")}`);
      if (lastUpdatedAt) parts.push(`sinceUpdatedAt=${encodeURIComponent(lastUpdatedAt)}`);
      return parts.join("&");
    }

    function noteMessage(m) {
      lastId = Math.max(Number(lastId) || 0, Number(m.id) || 0);
      if (m.updatedAt && m.updatedAt > lastUpdatedAt) lastUpdatedAt = m.updatedAt;
    }

    async function poll(signal) {
      if (!store.roomName || store.viewingArchive) return;
      try {
        const query = messageQuery();
        const msg = await api(`/api/rooms/${encodeURIComponent(store.roomName)}/messages?${query}`, { signal });
        if (signal.aborted) return;
        if (!lastId) renderMessages(msg.messages, true);
        else if (msg.messages.length) renderMessages(msg.messages, false);
        const room = await api(`/api/rooms/${encodeURIComponent(store.roomName)}`, { signal });
        if (signal.aborted || room.roomName !== store.roomName) return;
        applyRoom(room);
        setHint(t("pollingHint"));
      } catch (err) {
        if (err.name === "AbortError" || signal.aborted) return;
        if (err.status === 410 || err.status === 404) { leaveEndedRoom(err.message || t("roomArchived")); return; }
        if (err.status !== 401) setHint(err.message);
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
    }

    function leaveEndedRoom(message) {
      stopPoll();
      store.roomName = ""; store.isOwner = false; store.canArchive = false;
      store.viewingArchive = false; store.archiveId = null; lastId = 0; lastUpdatedAt = "";
      saveSession();
      $("roomTitle").textContent = t("chooseRoom");
      $("manageBtn").classList.add("hidden");
      $("composer").classList.remove("hidden");
      $("log").innerHTML = `<div class="empty">${escapeHtml(message || t("roomArchived"))}</div>`;
      renderOnline([]);
      refreshRooms().catch(() => {});
    }

    function scrollLogToBottom() {
      const log = $("log");
      log.scrollTop = log.scrollHeight;
    }

    function logPinnedToBottom() {
      const log = $("log");
      return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
    }

    function renderMessages(messages, replace, forceScroll) {
      const log = $("log");
      const pin = forceScroll || replace || logPinnedToBottom();
      if (replace) log.innerHTML = "";
      if (replace && !messages.length) {
        log.innerHTML = '<div class="empty">' + t("noMessages") + "</div>";
        return;
      }
      const empty = log.querySelector(".empty");
      if (empty) empty.remove();
      for (const m of messages) {
        noteMessage(m);
        const existing = !replace && m.id && log.querySelector(`[data-msg-id="${CSS.escape(String(m.id))}"]`);
        if (existing) {
          const wasStreaming = existing.classList.contains("streaming");
          existing.classList.toggle("streaming", !!m.streaming);
          if (!m.msgType || m.msgType === "text") {
            const body = existing.querySelector(".body");
            if (body && body.textContent !== (m.content || "")) body.textContent = m.content || "";
          }
          /* 流式回复（Agent）结束后朗读一次 */
          if (voiceCfg.autoRead && wasStreaming && !m.streaming && m.username !== store.username
              && (!m.msgType || m.msgType === "text") && m.content) {
            speakText(m.content, true, m.id);
          }
          continue;
        }
        const mine = m.username === store.username;
        const isText = !m.msgType || m.msgType === "text";
        const el = document.createElement("div");
        el.className = "bubble" + (mine ? " mine" : "") + (m.streaming ? " streaming" : "");
        if (m.id) el.dataset.msgId = String(m.id);
        el.innerHTML = `<div class="meta">${escapeHtml(m.username)} · ${escapeHtml(m.createdAt)}</div><div class="body"></div>`;
        const meta = el.querySelector(".meta");
        const body = el.querySelector(".body");
        if (m.msgType === "image") {
          body.innerHTML = `<img class="chat-img" alt="${escapeHtml(m.attachmentName || t("imageAlt"))}" data-src="${escapeHtml(m.downloadUrl)}" />`;
        } else if (m.msgType === "attachment") {
          body.innerHTML = `<a class="file" href="${m.downloadUrl}">📎 ${escapeHtml(m.attachmentName)}</a>`;
        } else {
          body.textContent = m.content || "";
          const spk = document.createElement("button");
          spk.type = "button";
          spk.className = "speak-btn";
          spk.dataset.msgId = String(m.id);
          spk.textContent = "🔊";
          spk.title = t("speakBtnTitle");
          spk.addEventListener("click", () => handleSpeakClick(m.id, m.content || ""));
          meta.appendChild(spk);
        }
        log.appendChild(el);
        hydrateImages(el, pin);
        /* 自动朗读：仅增量到达的他人新文本消息（初次加载 replace=true 不读） */
        if (!replace && voiceCfg.autoRead && m.username !== store.username && isText && !m.streaming && m.content) {
          speakText(m.content, true, m.id);
        }
      }
      if (pin) scrollLogToBottom();
    }

    function onComposerKey(event) {
      if (event.key !== "Enter") return;
      if (event.isComposing || event.keyCode === 229) return;
      if (event.shiftKey) return;
      event.preventDefault();
      sendMessage();
    }

    function resizeComposer() {
      const input = $("content");
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
      if (store.roomName && !store.viewingArchive) {
        localStorage.setItem(draftKey(store.roomName), input.value);
      }
    }

    async function sendMessage() {
      if (store.viewingArchive) return;
      const input = $("content");
      const content = input.value.trim();
      if (!content || !store.roomName) return;
      try {
        const sent = await api(`/api/rooms/${encodeURIComponent(store.roomName)}/messages`, {
          method: "POST", body: JSON.stringify({ content }),
        });
        input.value = "";
        resizeComposer();
        clearDraft(store.roomName);
        recDismissed = true; // 防止识别会话剩余的 onresult 把文本写回
        if (recListening) stopRec();
        renderMessages([sent], false, true);
      } catch (err) {
        if (err.status === 410) leaveEndedRoom(err.message);
        else if (err.status !== 401) setHint(err.message);
      }
    }

    const blobCache = new Map();

    async function authBlobUrl(path) {
      if (blobCache.has(path)) return blobCache.get(path);
      const res = await fetch(path, { headers: store.token ? { Authorization: "Bearer " + store.token } : {} });
      if (!res.ok) throw new Error(t("imageLoadFail"));
      const url = URL.createObjectURL(await res.blob());
      blobCache.set(path, url);
      return url;
    }

    function hydrateImages(root, pin) {
      root.querySelectorAll("img.chat-img[data-src]").forEach(async (img) => {
        const path = img.getAttribute("data-src");
        img.removeAttribute("data-src");
        if (!path) return;
        try {
          img.src = await authBlobUrl(path);
          img.addEventListener("click", () => window.open(img.src, "_blank"));
          img.addEventListener("load", () => { if (pin || logPinnedToBottom()) scrollLogToBottom(); });
          if (img.complete && (pin || logPinnedToBottom())) scrollLogToBottom();
        } catch {
          img.replaceWith(document.createTextNode(t("imageLoadFailText")));
        }
      });
    }

    async function sendFileFromInput(inputId) {
      const input = $(inputId);
      const file = input.files[0];
      input.value = "";
      await sendFile(file);
    }

    function appendLocalImage(file, localUrl, tempId) {
      const log = $("log");
      const empty = log.querySelector(".empty");
      if (empty) empty.remove();
      const el = document.createElement("div");
      el.className = "bubble mine";
      el.dataset.tempId = tempId;
      el.innerHTML = `
        <div class="meta">${escapeHtml(store.username)} · ${t("sending")}</div>
        <div class="body"><img class="chat-img" alt="${escapeHtml(file.name || t("imageAlt"))}" src="${localUrl}" /></div>`;
      const img = el.querySelector("img");
      img.addEventListener("load", scrollLogToBottom);
      img.addEventListener("click", () => window.open(localUrl, "_blank"));
      log.appendChild(el);
      scrollLogToBottom();
    }

    async function sendFile(file) {
      if (!file || !store.roomName || store.viewingArchive) return;
      const isImage = (file.type || "").startsWith("image/") || /\.(png|jpe?g|gif|webp|bmp)$/i.test(file.name || "");
      const tempId = "tmp-" + Date.now();
      const localUrl = isImage ? URL.createObjectURL(file) : null;
      if (localUrl) appendLocalImage(file, localUrl, tempId);
      const form = new FormData();
      form.append("file", file);
      try {
        const sent = await api(`/api/rooms/${encodeURIComponent(store.roomName)}/attachments`, { method: "POST", body: form });
        const temp = document.querySelector(`[data-temp-id="${tempId}"]`);
        if (temp && sent.id) {
          temp.dataset.msgId = String(sent.id);
          temp.removeAttribute("data-temp-id");
          const meta = temp.querySelector(".meta");
          if (meta) meta.textContent = `${store.username} · ${sent.createdAt}`;
          lastId = Math.max(Number(lastId) || 0, Number(sent.id) || 0);
          if (sent.downloadUrl && localUrl) blobCache.set(sent.downloadUrl, localUrl);
        } else {
          renderMessages([sent], false, true);
        }
        scrollLogToBottom();
      } catch (err) {
        document.querySelector(`[data-temp-id="${tempId}"]`)?.remove();
        if (localUrl) URL.revokeObjectURL(localUrl);
        setHint(err.message);
      }
    }

    // ---------- 房间管理 ----------

    async function openSettings() {
      $("editPassword").value = "";
      $("settings").showModal();
      if (!store.isOwner) {
        $("membersBox").textContent = t("membersReadOnly");
        return;
      }
      try {
        const data = await api(`/api/rooms/${encodeURIComponent(store.roomName)}/members`);
        renderMembers(data.members);
      } catch (err) { $("membersBox").textContent = err.message; }
    }

    function renderMembers(members) {
      const box = $("membersBox");
      if (!members.length) { box.textContent = t("noMembers"); return; }
      box.innerHTML = `
        <table class="perm-table">
          <tr><th>${t("memberCol")}</th><th>${t("speakCol")}</th><th>${t("attachCol")}</th><th>${t("historyCol")}</th><th></th></tr>
          ${members.map((m) => `
            <tr data-name="${escapeHtml(m.username)}">
              <td>${escapeHtml(m.username)} ${m.online ? "🟢" : ""} <span class="badge">${m.kind === "agent" ? t("kindAgent") : t("kindHuman")}</span></td>
              <td><input type="checkbox" data-p="canSpeak" ${m.canSpeak ? "checked" : ""} /></td>
              <td><input type="checkbox" data-p="canUpload" ${m.canUpload ? "checked" : ""} /></td>
              <td><input type="checkbox" data-p="canViewHistory" ${m.canViewHistory ? "checked" : ""} /></td>
              <td><button class="btn ghost small" data-save="${escapeHtml(m.username)}">${t("save")}</button></td>

    async function savePermissions(username) {
      const row = $("membersBox").querySelector(`tr[data-name="${username}"]`);
      const body = {};
      row.querySelectorAll("input[type=checkbox]").forEach((cb) => { body[cb.dataset.p] = cb.checked; });
      try {
        await api(`/api/rooms/${encodeURIComponent(store.roomName)}/permissions/${encodeURIComponent(username)}`, {
          method: "PUT", body: JSON.stringify(body),
        });
        setHint(tf("permUpdated", { name: username }));
      } catch (err) { setHint(err.message); }
    }

    async function saveRoom() {
      try {
        const body = {
          roomName: $("editName").value.trim(),
          visibility: $("editVisibility").value,
          muted: $("editMuted").checked,
        };
        const password = $("editPassword").value;
        if (password) body.password = password;
        const info = await api(`/api/rooms/${encodeURIComponent(store.roomName)}`, {
          method: "PATCH", body: JSON.stringify(body),
        });
        $("settings").close();
        await enterRoom(info);
      } catch (err) { setHint(err.message); }
    }

    async function clearRoomPassword() {
      try {
        const info = await api(`/api/rooms/${encodeURIComponent(store.roomName)}`, {
          method: "PATCH", body: JSON.stringify({ password: "" }),
        });
        $("settings").close();
        await enterRoom(info);
      } catch (err) { setHint(err.message); }
    }

    async function archiveRoom() {
      if (!confirm(t("archiveConfirm"))) return;
      try {
        await api(`/api/rooms/${encodeURIComponent(store.roomName)}/archive`, { method: "POST" });
        $("settings").close();
        leaveEndedRoom(t("archivedInList"));
        store.tab = "archive";
        $("tabArchive").classList.add("active");
        $("tabMine").classList.remove("active");
        $("tabPublic").classList.remove("active");
        await refreshRooms();
      } catch (err) { setHint(err.message); }
    }

      $("agents").showModal();

      const box = $("agentList");
      if (!data.agents.length) { box.innerHTML = '<div class="hint">' + t("noAgents") + "</div>"; return; }

          <span class="ops">

    function resetAgentForm() {
      editingAgent = null;
      $("agentFormTitle").textContent = t("createAgent");
      $("agentSubmit").textContent = t("create");
      $("agentCancelEdit").classList.add("hidden");
      $("agentName").disabled = false;
      $("agentName").value = "";
      $("agentKey").value = "";
    }

    function setAgentStatus(text, ok) {
      const el = $("agentStatus");
      el.textContent = text || "";
      el.style.color = ok ? "var(--ok)" : "var(--danger)";
    }

    async function submitAgent() {
      const username = $("agentName").value.trim();
      const publicKey = $("agentKey").value.trim();
      if (!publicKey) return setAgentStatus(t("pasteKey"));
      try {
        if (editingAgent) {
          await api(`/api/agents/${encodeURIComponent(editingAgent)}`, {
            method: "PATCH", body: JSON.stringify({ publicKey }),
          });
          setAgentStatus(t("keyUpdated"), true);
        } else {
          if (!username) return setAgentStatus(t("fillAgentName"));
          await api("/api/agents", { method: "POST", body: JSON.stringify({ username, publicKey }) });
          setAgentStatus(tf("agentCreated", { name: username }), true);
        }
        resetAgentForm();
        await refreshAgents();
      } catch (err) { setAgentStatus(err.message); }
    }

    async function agentAction(username, act) {
      try {
        if (act === "rename") {
          const name = prompt(t("newAgentName"), username);
          if (!name || name === username) return;
          await api(`/api/agents/${encodeURIComponent(username)}`, { method: "PATCH", body: JSON.stringify({ username: name.trim() }) });
        } else if (act === "rekey") {
          editingAgent = username;
          $("agentFormTitle").textContent = tf("rekeyFor", { name: username });
          $("agentSubmit").textContent = t("saveKey");
          $("agentCancelEdit").classList.remove("hidden");
          $("agentName").value = username;
          $("agentName").disabled = true;
          $("agentKey").value = "";
          $("agentKey").focus();
          return;
        } else if (act === "toggle") {
          const row = document.querySelector(`.agent-row[data-name="${username}"] .badge`);
          const next = row.textContent === t("agentActive") ? "disabled" : "active";
          await api(`/api/agents/${encodeURIComponent(username)}`, { method: "PATCH", body: JSON.stringify({ status: next }) });
        } else if (act === "del") {
          if (!confirm(tf("deleteAgentConfirm", { name: username }))) return;
          await api(`/api/agents/${encodeURIComponent(username)}`, { method: "DELETE" });
        }
        await refreshAgents();
      } catch (err) { setAgentStatus(err.message); }
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    // ---------- 语音模块（v2.0 · 浏览器 Web Speech API：ASR + TTS，纯前端） ----------
    const hasTTS = "speechSynthesis" in window;
    const voiceSynth = hasTTS ? window.speechSynthesis : null;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasASR = !!SpeechRec;
    const IS_WECHAT = /MicroMessenger/i.test(navigator.userAgent || "");
    const VOICE_CFG_KEY = "webharness.voice.v1";
    const FEMALE_HINT = /ting|mei|hui|yao|xiao|sin|jiao|qian|female|samantha|victoria|karen|moira|tessa|fiona|zoe|ava|allison|kathy|susan|婷婷|美|慧|雅|瑶|晓|倩|丽|娜|芳|莉|静|娇|茜/i;

    const voiceCfg = (() => {
      const d = { autoRead: true, autoSend: false, rate: 1, lang: "", voiceURI: "" };
      try {
        const c = JSON.parse(localStorage.getItem(VOICE_CFG_KEY) || "{}") || {};
        if (typeof c.autoRead === "boolean") d.autoRead = c.autoRead;
        if (typeof c.autoSend === "boolean") d.autoSend = c.autoSend;
        const r = Number(c.rate); if (r >= 0.5 && r <= 2) d.rate = r;
        if (c.lang) d.lang = c.lang;
        if (c.voiceURI) d.voiceURI = c.voiceURI;
      } catch (e) {}
      return d;
    })();
    function saveVoiceCfg() {
      try { localStorage.setItem(VOICE_CFG_KEY, JSON.stringify(voiceCfg)); } catch (e) {}
    }

    let voiceList = [];
    let speaking = false;
    let speakingMsgId = null;
    let rec = null;
    let recListening = false;
    let recBase = "";
    let recFinal = "";
    let recDismissed = false; // 发送成功后忽略本次识别会话剩余的 onresult 写回
    let recManualStop = false; // 用户手动停止识别（不触发「识别完自动发送」）

    function voiceToast(msg) {
      let t = $("voiceToast");
      if (!t) {
        t = document.createElement("div");
        t.id = "voiceToast";
        t.style.cssText =
          "position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10151d;" +
          "border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:13px;color:var(--text);" +
          "z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.45);transition:opacity .2s;pointer-events:none";
        document.body.appendChild(t);
      }
      t.textContent = msg;
      t.style.opacity = "1";
      clearTimeout(voiceToast._tm);
      voiceToast._tm = setTimeout(() => { t.style.opacity = "0"; }, 2800);
    }

    // ---- TTS：发音人加载 / 自动选声 / 朗读 ----
    function loadVoices() {
      if (!hasTTS) return;
      voiceList = voiceSynth.getVoices();
      const sel = $("vVoice");
      if (!sel) return;
      sel.innerHTML = '<option value="">' + t("autoVoice") + "</option>";
      const byLang = (a, b) =>
        (a.lang.replace("_", "-").startsWith("zh") ? 0 : 1) - (b.lang.replace("_", "-").startsWith("zh") ? 0 : 1) ||
        a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name);
      [...voiceList].sort(byLang).forEach((v) => {
        const o = document.createElement("option");
        o.value = v.voiceURI;
        o.textContent = `${v.name} — ${v.lang}${v.localService ? "" : t("onlineSuffix")}`;
        sel.appendChild(o);
      });
      if (voiceCfg.voiceURI && voiceList.some((v) => v.voiceURI === voiceCfg.voiceURI)) {
        sel.value = voiceCfg.voiceURI;
      }
    }

    function pickVoice() {
      if (voiceCfg.voiceURI) {
        const hit = voiceList.find((v) => v.voiceURI === voiceCfg.voiceURI);
        if (hit) return hit;
      }
      /* 自动挑选：中文 100 分 / 英文 10 分，女声词表 +50（同 FXG 参考实现） */
      let best = null, bestScore = -1;
      for (const v of voiceList) {
        const lang = v.lang.replace("_", "-").toLowerCase();
        let sc = lang.startsWith("zh") ? 100 : (lang.startsWith("en") ? 10 : 0);
        if (FEMALE_HINT.test(v.name)) sc += 50;
        if (sc > bestScore) { bestScore = sc; best = v; }
      }
      return best;
    }

    function stripEmoji(text) {
      return String(text)
        .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}]/gu, "")
        .trim();
    }

    function speakText(text, cut, msgId) {
      if (!hasTTS) return;
      const clean = stripEmoji(text);
      if (!clean) return;
      if (msgId) speakingMsgId = msgId;
      const target = cut && clean.length > 400 ? clean.slice(0, 400) + t("speakTruncated") : clean;
      const doSpeak = () => {
        const u = new SpeechSynthesisUtterance(target);
        const v = pickVoice();
        if (v) { u.voice = v; u.lang = v.lang; }
        if (voiceCfg.lang) u.lang = voiceCfg.lang;
        u.rate = voiceCfg.rate;
        u.onstart = () => {
          speaking = true;
          /* Chrome 长句约 15 秒后静默停止：周期性 pause/resume 保活 */
          if (/Chrome/i.test(navigator.userAgent) && voiceSynth.pause) {
            clearInterval(voiceSynth._keep);
            voiceSynth._keep = setInterval(() => {
              if (speaking) { try { voiceSynth.pause(); voiceSynth.resume(); } catch (e) {} }
            }, 5000);
          }
          renderSpeakBtn();
        };
        const finish = () => {
          speaking = false;
          clearInterval(voiceSynth._keep);
          renderSpeakBtn();
        };
        u.onend = finish;
        u.onerror = (e) => {
          finish();
          if (e.error === "not-allowed") voiceToast(t("ttsBlocked"));
        };
        voiceSynth.speak(u);
      };
      if (voiceSynth.speaking || voiceSynth.pending) {
        /* Chrome 已知问题：cancel() 后同帧再 speak() 会被一并取消，须推迟一拍 */
        voiceSynth.cancel();
        setTimeout(doSpeak, 80);
      } else {
        doSpeak();
      }
    }

    function stopSpeaking() {
      if (!hasTTS) return;
      voiceSynth.cancel();
      speaking = false;
      speakingMsgId = null;
      clearInterval(voiceSynth._keep);
      renderSpeakBtn();
    }

    function handleSpeakClick(id, content) {
      if (speaking && speakingMsgId === id) { stopSpeaking(); return; }
      speakingMsgId = id;
      speakText(content, false);
    }

    function renderSpeakBtn() {
      document.querySelectorAll(".speak-btn").forEach((b) => {
        const on = speaking && b.dataset.msgId === String(speakingMsgId);
        b.classList.toggle("speaking", on);
        b.textContent = on ? "⏹" : "🔊";
      });
    }

    // ---- ASR：麦克风语音输入 ----
    function toggleRec() {
      if (IS_WECHAT) { voiceToast(t("wechatVoice")); return; }
      if (!hasASR) { voiceToast(t("noASR")); return; }
      if (recListening) { stopRec(); return; }
      startRec();
    }

    function startRec() {
      recBase = $("content").value.trim();
      recFinal = "";
      recDismissed = false;
      recManualStop = false;
      try {
        rec = new SpeechRec();
        rec.lang = voiceCfg.lang || (navigator.language || "zh-CN").replace("_", "-");
        rec.interimResults = true;
        rec.continuous = false;
        recListening = true;
        renderMicUI();
        rec.onstart = renderMicUI;
        rec.onresult = (e) => {
          if (recDismissed) return;
          let final = "", interim = "";
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const r = e.results[i];
            if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript;
          }
          if (final) recFinal = final;
          const input = $("content");
          const tail = final + interim;
          input.value = recBase ? recBase + " " + tail : tail;
          resizeComposer();
        };
        rec.onerror = (e) => {
          recListening = false;
          renderMicUI();
          if (e.error === "aborted") return;
          const map = {
            "no-speech": t("asrNoSpeech"),
            "audio-capture": t("asrAudio"),
            "not-allowed": t("asrNotAllowed"),
            "service-not-allowed": t("asrService"),
            network: t("asrNetwork"),
          };
          voiceToast(map[e.error] || t("asrError") + e.error);
        };
        rec.onend = () => {
          recListening = false;
          renderMicUI();
          if (recManualStop) { recManualStop = false; return; }
          if (voiceCfg.autoSend && recFinal && !recDismissed) sendMessage();
        };
        rec.start();
      } catch (e) {
        recListening = false;
        renderMicUI();
        voiceToast(t("asrStartFail") + e.message);
      }
    }

    function stopRec() {
      recManualStop = true;
      if (rec) { try { rec.stop(); } catch (e) {} }
      setTimeout(() => { if (recListening && rec) { try { rec.abort(); } catch (e) {} } }, 600);
    }

    function renderMicUI() {
      const b = $("micBtn");
      if (!b) return;
      b.classList.toggle("listening", recListening);
      b.classList.toggle("unsupported", !hasASR || IS_WECHAT);
      b.textContent = recListening ? "⏹" : "🎤";
      b.title = recListening ? t("stopRecTitle") : t("micTitle");
    }

    // ---- 语音设置 UI ----
    function initVoiceUI() {
      const toggles = $("voiceToggles");
      if (toggles) toggles.style.display = hasTTS ? "" : "none";
      renderAutoReadBtn();
      renderMicUI();
      if (hasTTS) { loadVoices(); voiceSynth.onvoiceschanged = loadVoices; }
    }

    function renderAutoReadBtn() {
      const b = $("autoReadBtn");
      if (!b) return;
      const span = b.querySelector("span");
      if (span) span.textContent = t("autoRead");
      b.classList.toggle("voice-on", voiceCfg.autoRead);
    }

    function toggleAutoRead() {
      voiceCfg.autoRead = !voiceCfg.autoRead;
      saveVoiceCfg();
      renderAutoReadBtn();
      if (!voiceCfg.autoRead) stopSpeaking(); // 关闭自动朗读时立即停止当前朗读
      voiceToast(voiceCfg.autoRead ? t("autoReadEnabled") : t("autoReadDisabled"));
    }

    function openVoiceSettings() {
      const sel = $("vVoice");
      if (hasTTS) {
        if (!sel.options.length) loadVoices();
      } else {
        sel.innerHTML = '<option value="">' + t("noTTS") + "</option>";
      }
      $("vAutoRead").checked = voiceCfg.autoRead;
      $("vAutoSend").checked = voiceCfg.autoSend;
      $("vRate").value = voiceCfg.rate;
      $("vRateVal").textContent = Number(voiceCfg.rate).toFixed(1);
      $("vLang").value = voiceCfg.lang || "";
      $("voiceStatus").textContent = "";
      $("voiceDlg").showModal();
    }

    function saveVoiceSettings() {
      voiceCfg.autoRead = $("vAutoRead").checked;
      voiceCfg.autoSend = $("vAutoSend").checked;
      voiceCfg.rate = Math.min(2, Math.max(0.5, Number($("vRate").value) || 1));
      voiceCfg.lang = $("vLang").value;
      const vURI = $("vVoice").value;
      voiceCfg.voiceURI = hasTTS && vURI ? vURI : "";
      saveVoiceCfg();
      renderAutoReadBtn();
      $("voiceDlg").close();
      voiceToast(t("voiceSaved"));
    }

    (async function boot() {
      applyI18n();
      initVoiceUI();
      $("content").addEventListener("paste", (event) => {
        const item = [...(event.clipboardData?.items || [])].find((it) => it.type.startsWith("image/"));
        if (!item) return;
        event.preventDefault();
        sendFile(item.getAsFile());
      });
      if (!store.token) return;
      try {
        const me = await api("/api/me");
        store.username = me.username;
        saveSession();
        showApp();
        await refreshRooms();
        if (store.roomName) await openRoom(store.roomName);
      } catch { /* token 失效已在 api() 里处理 */ }
    })();
  </script>
</body>
</html>
